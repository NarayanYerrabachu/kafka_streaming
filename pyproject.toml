[project]
name = "kafka-streaming"
version = "0.1.0"
description = "Local big-data streaming pipeline: Kafka, Spark Structured Streaming, Iceberg, ClickHouse"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro,schemaregistry]>=2.6",
    "requests>=2.32",
]

[project.scripts]
ks-produce = "kafka_streaming.producer:main"
ks-consume = "kafka_streaming.consumer:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pre-commit>=3.7",
    "ruff>=0.6",
    "testcontainers[kafka]>=4.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not stack'"
markers = [
    "integration: spins up Kafka + Schema Registry with Testcontainers (needs Docker)",
    "stack: checks the running docker-compose stack (needs `make up`)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
